---
_ctxlic_ceipoptin_values:
  diagnostic: DIAGNOSTIC
  unidentified: Unidentified
  none: NONE

_ctxlic_install_directory_arguments: >-
  {{ ["INSTALLDIR=\\" + ctxlic_install_directory + "\\"] if ctxlic_install_directory is defined else [] }}

_ctxlic_license_server_port_arguments: >-
  {{ ["LICSERVERPORT=" + ctxlic_license_server_port] if ctxlic_license_server_port is defined else [] }}

_ctxlic_ctxlic_vendor_daemon_port_arguments: >-
  {{ ["VENDORDAEMONPORT=" + ctxlic_vendor_daemon_port] if ctxlic_vendor_daemon_port is defined else [] }}

_ctxlic_web_services_for_licensing_port_arguments: >-
  {{ ["WEBSERVICESLICENSINGPORT=" + ctxlic_web_services_for_licensing_port] if ctxlic_web_services_for_licensing_port is defined else [] }}

_ctxlic_ceip_optin_arguments: >-
  {{ ["CEIPOPTIN=" + _ctxlic_ceipoptin_values[ctxlic_ceip_optin]] if ctxlic_ceip_optin is defined else [] }}

_ctxlic_install_arguments: >-
  {{ _ctxlic_install_directory_arguments +
      _ctxlic_license_server_port_arguments +
      _ctxlic_ctxlic_vendor_daemon_port_arguments +
      _ctxlic_web_services_for_licensing_port_arguments +
      _ctxlic_ceip_optin_arguments }}
