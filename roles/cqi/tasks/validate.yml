---
- name: Gather OS facts
  when:
    - ansible_facts.distribution is not defined or
      ansible_facts.os_family is not defined
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution

- name: Validate OS
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Windows'
    fail_msg: "This role only supports Windows.  {{ ansible_facts.distribution }} is not supported."
    success_msg: "This role supports {{ ansible_facts.distribution }}."
